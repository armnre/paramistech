# Local use WITHOUT Caddy/HTTPS:
#   docker compose -f docker-compose.yml -f docker-compose.override.example.yml up -d --build
# Set NEXT_PUBLIC_SITE_URL=http://localhost:3000 in .env first (admin Origin checks use it).
services:
  app:
    ports:
      - "3000:3000"
    environment:
      # Nobody overwrites X-Forwarded-For locally, so it must not be trusted.
      TRUST_PROXY: "false"
  caddy:
    # Only starts when explicitly requested: --profile proxy
    profiles: ["proxy"]
